<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Symptom Checker - Medicure Smart Health Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">⚕️ Medicure <span>Smart Health</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="#" id="logoutBtn" class="btn-login">Logout</a></li>
    </ul>
  </div>
</nav>

<section class="checker">
  <div class="checker-card fade-in">
    <h2>Smart Health Symptom Checker</h2>
    <p class="section-sub">Describe your symptoms below or use voice input.</p>

    <textarea id="symptomInput" placeholder="E.g. I have fever, cough and body pain..."></textarea>

    <div class="checker-actions">
      <button id="voiceBtn" class="btn-secondary">🎙 Voice Input</button>
      <button id="clearBtn" class="btn-secondary">🗑 Clear</button>
      <button id="analyzeBtn" class="btn-primary">✨ Get Suggestions</button>
    </div>

    <div id="loader" class="loader hidden"><div class="spinner"></div><p>Analyzing your symptoms...</p></div>

    <div id="results" class="results"></div>

    <p class="disclaimer-mini">⚠️ This website provides general health information only and is not a substitute for professional medical advice.</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
