<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Medicure AI Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">⚕️ Medicure <span>AI</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#features">Features</a></li>
    </ul>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card fade-in">
    <h2>Welcome Back</h2>
    <p class="auth-sub">Sign in to access your health assistant</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
        <small class="error" id="emailErr"></small>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Enter password" required />
          <button type="button" class="pw-toggle" id="pwToggle">👁</button>
        </div>
        <small class="error" id="pwErr"></small>
      </div>
      <button type="submit" class="btn-primary full">Login</button>
    </form>
    <p class="auth-foot">No account needed — demo login.</p>
    <p class="disclaimer-mini">This website provides general health information only and is not a substitute for professional medical advice.</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
